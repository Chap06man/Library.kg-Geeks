<h1>Список задач</h1>
<a href="/create_basket/">Добавить задачу</a>
{% for i in basket_list %}
<h2>Задача - {{ i.name_order }}</h2>
<p>Статус - {{ i.status }}</p>

<a href="{{ i.screenshots.url }}" download>Скачать файл</a>
<p>Дата создания - {{ i.created_at }}</p>
<a href="/book_list/{{ i.id }}/delete/">Удалить</a>
<a href="/book_list/{{ i.id }}/update/">Изменить</a>
{% endfor %}
